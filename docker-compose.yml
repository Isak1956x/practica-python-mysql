services:

  app:
    build: ./src
    container_name: mi-aplicacion
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: practica_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: